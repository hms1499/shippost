<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- coin only exists left of the slit's centerline: it covers the slit's
         left stroke, so it reads as passing through, not resting against -->
    <clipPath id="into-slit"><rect x="0" y="0" width="372" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="#0A0D0A"/>
  <!-- machine face -->
  <rect x="296" y="64" width="152" height="384" rx="26" fill="#111611" stroke="#27351F" stroke-width="5"/>
  <!-- coin slit -->
  <rect x="354" y="112" width="36" height="288" rx="18" fill="#0A0D0A" stroke="#59F87D" stroke-width="10"/>
  <!-- tilted 5¢ coin, mid-insertion -->
  <g clip-path="url(#into-slit)">
    <g transform="rotate(-14 252 256)">
      <circle cx="252" cy="256" r="132" fill="#FFC247"/>
      <circle cx="252" cy="256" r="132" fill="none" stroke="#8A5A00" stroke-width="6" opacity="0.5"/>
      <circle cx="252" cy="256" r="102" fill="none" stroke="#8A5A00" stroke-width="4" opacity="0.35"/>
      <text x="252" y="260" text-anchor="middle" dominant-baseline="central"
            font-family="ui-monospace, Menlo, 'JetBrains Mono', monospace"
            font-size="104" font-weight="700" fill="#0A0D0A">5&#162;</text>
    </g>
  </g>
</svg>
